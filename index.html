<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyCMS</title>
<style>
:root{
  --wp-blue:#2271b1;
  --wp-blue-dark:#135e96;
  --wp-dark:#1d2327;
  --wp-darker:#101417;
  --wp-gray-0:#f6f7f7;
  --wp-gray-5:#f0f0f1;
  --wp-gray-10:#e5e5e5;
  --wp-gray-20:#c3c4c7;
  --wp-gray-50:#8c8f94;
  --wp-gray-80:#2c3338;
  --radius:8px;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --gh-green:#2da44e;
  --gh-green-dark:#1a7f37;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen-Sans,Ubuntu,Cantarell,"Helvetica Neue",sans-serif;color:#1e1e1e;background:#fff;-webkit-font-smoothing:antialiased}
a{color:var(--wp-blue);text-decoration:none}
a:hover{color:var(--wp-blue-dark)}
img{max-width:100%;height:auto}

/* Public */
.site-header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--wp-gray-10)}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.header-inner{display:flex;align-items:center;gap:28px;height:68px}
.logo{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--wp-dark);display:flex;align-items:center;gap:8px}
.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--wp-blue);display:inline-block}
.nav{display:flex;gap:24px}
.nav a{color:#50575e;font-weight:500;font-size:15px;padding:8px 0;position:relative}
.nav a.active,.nav a:hover{color:var(--wp-dark)}
.nav a.active::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--wp-dark);border-radius:2px}
.search-box{margin-left:auto;position:relative}
.search-box input{width:220px;padding:9px 36px 9px 14px;border:1px solid var(--wp-gray-20);border-radius:24px;background:#fff;font-size:14px;transition:all .2s}
.search-box input:focus{outline:none;border-color:var(--wp-blue);box-shadow:0 0 0 1px var(--wp-blue);width:260px}
.search-box button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;padding:4px;cursor:pointer;color:var(--wp-gray-50)}
.mobile-toggle{display:none;background:none;border:none;font-size:24px;cursor:pointer;color:var(--wp-dark)}

.main{padding:48px 0 80px;min-height:70vh}
.page-head{max-width:760px;margin:0 auto 40px;text-align:center}
.page-title{font-size:48px;line-height:1.1;margin:0 0 12px;letter-spacing:-1px}
.page-desc{font-size:18px;color:#50575e;margin:0}

.post-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px}
.post-card{background:#fff;border:1px solid var(--wp-gray-10);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:all .25s ease;cursor:pointer}
.post-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px -10px rgba(0,0,0,.15);border-color:var(--wp-gray-20)}
.post-card-img-wrap{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--wp-gray-5)}
.post-card-img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.post-card:hover .post-card-img{transform:scale(1.04)}
.post-card-body{padding:22px;flex:1;display:flex;flex-direction:column}
.post-card-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--wp-blue)}
.post-card-title{font-size:21px;margin:8px 0 10px;line-height:1.3;color:var(--wp-dark);font-weight:700}
.post-card-excerpt{color:#50575e;font-size:15px;line-height:1.6;flex:1}
.post-card-meta{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--wp-gray-5);font-size:13px;color:var(--wp-gray-50)}

/* Portfolio/Media embed */
.media-embed-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:28px}
.media-embed-wrap iframe,.media-embed-wrap video{width:100%;height:100%;border:none}

.article-wrap{max-width:800px;margin:0 auto}
.article-hero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;margin-bottom:36px;background:var(--wp-gray-5)}
.article-cat{display:inline-block;padding:4px 10px;background:var(--wp-gray-5);border-radius:20px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--wp-blue);margin-bottom:16px}
.article-title{font-size:48px;line-height:1.1;margin:0 0 16px;letter-spacing:-1px;font-weight:800}
.article-meta{display:flex;gap:16px;align-items:center;color:var(--wp-gray-50);font-size:14px;margin-bottom:32px}
.article-content{font-size:18px;line-height:1.8;color:#2c3338}
.article-content p{margin:0 0 1.4em}
.article-content h2{font-size:30px;margin:2em 0 .6em;line-height:1.2;letter-spacing:-.5px}
.article-content h3{font-size:22px;margin:1.6em 0 .5em}
.article-content ul,.article-content ol{padding-left:1.4em;margin:0 0 1.4em}
.article-content li{margin:.4em 0}
.article-content blockquote{margin:2em 0;padding:1em 1.4em;border-left:4px solid var(--wp-blue);background:var(--wp-gray-5);border-radius:0 8px 8px 0;font-style:italic;color:#50575e}
.article-content img{border-radius:12px;margin:2em 0}
.article-content a{text-decoration:underline;text-underline-offset:3px}

/* Gallery public */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:8px}
.gallery-item{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--wp-gray-5);cursor:pointer;position:relative}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.gallery-item:hover img{transform:scale(1.06)}
.gallery-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:flex;align-items:center;justify-content:center}
.gallery-lightbox img{max-width:90vw;max-height:90vh;border-radius:8px}
.gallery-lightbox-close{position:absolute;top:20px;right:24px;font-size:32px;color:#fff;cursor:pointer;line-height:1;background:none;border:none}

/* Downloads public */
.downloads-list{display:flex;flex-direction:column;gap:16px}
.download-card{background:#fff;border:1px solid var(--wp-gray-10);border-radius:10px;padding:22px;display:flex;align-items:center;gap:20px}
.download-icon{width:48px;height:48px;border-radius:10px;background:var(--wp-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.download-info{flex:1}
.download-title{font-size:17px;font-weight:700;color:var(--wp-dark);margin:0 0 4px}
.download-desc{font-size:14px;color:#50575e;margin:0}
.download-btn{flex-shrink:0}

.site-footer{border-top:1px solid var(--wp-gray-10);padding:40px 0;text-align:center;color:var(--wp-gray-50);font-size:14px}
.empty-state{text-align:center;padding:80px 20px;color:var(--wp-gray-50)}
.empty-state h3{font-size:22px;color:var(--wp-dark);margin:0 0 8px}

/* Login */
.login-body{background:var(--wp-gray-5);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-wrap{width:100%;max-width:380px}
.login-logo{text-align:center;font-size:32px;font-weight:800;margin:0 0 24px;color:var(--wp-dark);display:flex;align-items:center;justify-content:center;gap:10px}
.login-card{background:#fff;padding:28px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.13);border:1px solid var(--wp-gray-20)}
.login-field{margin-bottom:18px}
.login-label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;color:#2c3338}
.login-input{width:100%;padding:10px 12px;border:1px solid var(--wp-gray-50);border-radius:4px;font-size:16px}
.login-input:focus{outline:none;border-color:var(--wp-blue);box-shadow:0 0 0 1px var(--wp-blue)}
.login-error{background:#fcf0f1;border-left:4px solid #d63638;padding:12px;margin-bottom:16px;font-size:14px;color:#d63638}
.login-hint{margin-top:20px;text-align:center;font-size:13px;color:var(--wp-gray-50)}
.btn-login{width:100%;padding:10px;background:var(--wp-blue);color:#fff;border:1px solid var(--wp-blue);border-radius:4px;font-size:15px;font-weight:500;cursor:pointer}
.btn-login:hover{background:var(--wp-blue-dark)}

/* Admin */
.wp-admin{display:flex;min-height:100vh;background:var(--wp-gray-5)}
.admin-sidebar{width:260px;background:var(--wp-dark);color:#f0f0f1;position:fixed;left:0;top:0;bottom:0;overflow-y:auto;z-index:200;display:flex;flex-direction:column}
.admin-logo{padding:18px 20px;font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;color:#fff;border-bottom:1px solid #2c3338}
.admin-menu{list-style:none;margin:0;padding:12px 0;flex:1}
.admin-menu li{margin:0}
.admin-menu a{display:flex;align-items:center;gap:12px;padding:10px 20px;color:#c3c4c7;text-decoration:none;font-size:14px;transition:all .15s;border-left:3px solid transparent}
.admin-menu a:hover{color:#fff;background:#2c3338}
.admin-menu a.active{background:#2271b1;color:#fff;border-left-color:#72aee6}
.admin-menu svg{width:18px;height:18px;opacity:.8}
.admin-menu .menu-sep{height:1px;background:#2c3338;margin:12px 20px}
.admin-main{flex:1;margin-left:260px;min-width:0;display:flex;flex-direction:column}
.admin-topbar{height:60px;background:#fff;border-bottom:1px solid var(--wp-gray-20);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:90}
.admin-burger{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--wp-dark);padding:4px}
.admin-title{font-size:20px;font-weight:500;color:var(--wp-dark);flex:1}
.admin-user{display:flex;align-items:center;gap:8px;font-size:13px;color:#50575e}
.admin-avatar{width:28px;height:28px;border-radius:50%;background:var(--wp-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.admin-content{padding:24px;flex:1}
.admin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150}

/* GitHub status indicator */
.gh-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:12px;font-weight:600;margin-left:auto}
.gh-status.connected{background:#e6f4ea;color:#1a7f37}
.gh-status.disconnected{background:#fff3cd;color:#856404}
.gh-status.error{background:#fcf0f1;color:#d63638}
.gh-dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* Spinner */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.1);border-top-color:var(--wp-blue);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{position:absolute;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:10;border-radius:4px}

.wp-notice{padding:12px 16px;background:#fff;border-left:4px solid #72aee6;box-shadow:0 1px 1px rgba(0,0,0,.04);margin-bottom:20px;border-radius:0 4px 4px 0}
.wp-notice.success{border-left-color:#00a32a;background:#f0fff4}
.wp-notice.error{border-left-color:#d63638;background:#fcf0f1;color:#d63638}
.wp-notice.warning{border-left-color:#dba617;background:#fffbeb}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:28px}
.stat-card{background:#fff;border:1px solid var(--wp-gray-20);border-radius:6px;padding:20px;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.stat-label{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--wp-gray-50);font-weight:600;margin-bottom:8px}
.stat-value{font-size:32px;font-weight:600;line-height:1;color:var(--wp-dark)}
.stat-sub{font-size:13px;color:var(--wp-gray-50);margin-top:6px}

.wp-card{background:#fff;border:1px solid var(--wp-gray-20);border-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.04);margin-bottom:20px;position:relative}
.wp-card-header{padding:14px 20px;border-bottom:1px solid var(--wp-gray-10);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wp-card-title{font-size:14px;font-weight:600;margin:0}
.wp-card-body{padding:20px}

.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filter-tabs{display:flex;gap:2px;background:var(--wp-gray-5);padding:3px;border-radius:6px}
.filter-tabs button{padding:6px 14px;border:none;background:transparent;border-radius:4px;font-size:13px;cursor:pointer;color:#50575e;font-weight:500}
.filter-tabs button.active{background:#fff;color:var(--wp-dark);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search-mini{margin-left:auto;position:relative}
.search-mini input{padding:7px 28px 7px 10px;border:1px solid var(--wp-gray-20);border-radius:4px;font-size:13px;width:200px}
.search-mini svg{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--wp-gray-50)}

.table-wrap{overflow-x:auto}
.wp-table{width:100%;border-collapse:collapse;font-size:14px}
.wp-table th{text-align:left;padding:10px 12px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--wp-gray-50);border-bottom:1px solid var(--wp-gray-20);background:var(--wp-gray-0);white-space:nowrap}
.wp-table td{padding:14px 12px;border-bottom:1px solid var(--wp-gray-5);vertical-align:top}
.wp-table tr:hover td{background:#f6f7f7}
.wp-table .row-title{font-weight:600;color:var(--wp-blue);cursor:pointer}
.wp-table .row-title:hover{color:var(--wp-blue-dark)}
.row-actions{display:flex;gap:12px;margin-top:6px;font-size:13px;visibility:hidden}
.wp-table tr:hover .row-actions{visibility:visible}
.row-actions a{color:var(--wp-blue)}
.row-actions a.delete{color:#b32d2e}
.status-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.status-published{background:#e7f5e9;color:#1f6b2c}
.status-draft{background:#f0f0f1;color:#50575e}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:3px;border:1px solid;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;line-height:1.4;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--wp-blue);border-color:var(--wp-blue);color:#fff}
.btn-primary:hover{background:var(--wp-blue-dark);border-color:var(--wp-blue-dark);color:#fff}
.btn-secondary{background:#fff;border-color:var(--wp-gray-20);color:var(--wp-dark)}
.btn-secondary:hover{border-color:var(--wp-gray-50);background:#f6f7f7}
.btn-danger{background:#d63638;border-color:#d63638;color:#fff}
.btn-danger:hover{background:#b32d2e}
.btn-success{background:var(--gh-green);border-color:var(--gh-green);color:#fff}
.btn-success:hover{background:var(--gh-green-dark);border-color:var(--gh-green-dark)}
.btn:disabled{opacity:.55;cursor:not-allowed}

.form-grid{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
.form-main,.form-side{display:flex;flex-direction:column;gap:20px}
.form-row{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:13px;font-weight:500;color:var(--wp-dark)}
.form-hint{font-size:12px;color:var(--wp-gray-50);margin-top:4px}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 10px;border:1px solid var(--wp-gray-50);border-radius:4px;font-size:14px;font-family:inherit;background:#fff}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--wp-blue);box-shadow:0 0 0 1px var(--wp-blue)}
.form-textarea{min-height:80px;resize:vertical;line-height:1.5}
.title-input{font-size:22px!important;padding:10px 12px!important;font-weight:600}

.editor-wrap{border:1px solid var(--wp-gray-50);border-radius:4px;overflow:hidden;background:#fff}
.editor-toolbar{display:flex;flex-wrap:wrap;gap:2px;padding:6px;background:var(--wp-gray-0);border-bottom:1px solid var(--wp-gray-20)}
.editor-toolbar button{width:32px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:#2c3338;font-size:14px}
.editor-toolbar button:hover{background:#fff;border-color:var(--wp-gray-20)}
.editor-toolbar .sep{width:1px;height:20px;background:var(--wp-gray-20);margin:0 4px;align-self:center}
.editor-content{min-height:300px;padding:16px;outline:none;font-size:15px;line-height:1.7}
.editor-content:empty:before{content:attr(data-placeholder);color:#a7aaad;pointer-events:none}

.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.media-item{aspect-ratio:1;background:var(--wp-gray-5);border-radius:4px;overflow:hidden;border:1px solid var(--wp-gray-10)}
.media-item img{width:100%;height:100%;object-fit:cover}

/* Gallery Admin */
.gallery-admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:20px}
.gallery-admin-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--wp-gray-5);border:1px solid var(--wp-gray-10)}
.gallery-admin-item img{width:100%;height:100%;object-fit:cover}
.gallery-admin-item .item-del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);border:none;color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.gallery-admin-item .item-del:hover{background:#d63638}

/* GitHub config card */
.gh-config-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gh-token-row{grid-column:1/-1}
.token-input-wrap{position:relative}
.token-input-wrap input{padding-right:40px}
.token-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--wp-gray-50);font-size:13px}

/* Responsive */
@media (max-width:960px){
  .form-grid{grid-template-columns:1fr}
  .form-side{order:-1}
  .gh-config-grid{grid-template-columns:1fr}
  .gh-token-row{grid-column:1}
}
@media (max-width:782px){
  .admin-sidebar{transform:translateX(-100%);transition:transform .25s;width:280px}
  .admin-sidebar.open{transform:translateX(0);box-shadow:0 0 20px rgba(0,0,0,.3)}
  .admin-main{margin-left:0}
  .admin-burger{display:block}
  .admin-overlay.open{display:block}
  .header-inner{height:auto;padding:14px 0;flex-wrap:wrap;gap:14px}
  .nav{order:3;width:100%;justify-content:center;border-top:1px solid var(--wp-gray-10);padding-top:12px}
  .mobile-toggle{display:block;margin-left:auto}
  .search-box{display:none}
  .search-box.open{display:block;width:100%;order:4;margin:8px 0 0}
  .search-box.open input{width:100%}
  .post-grid{grid-template-columns:1fr}
  .page-title,.article-title{font-size:36px}
  .admin-content{padding:16px}
  .dashboard-grid{grid-template-columns:1fr 1fr}
  .toolbar{flex-direction:column;align-items:stretch}
  .search-mini{margin-left:0;width:100%}
  .search-mini input{width:100%}
  .row-actions{visibility:visible}
}
@media (max-width:480px){
  .container{padding:0 16px}
  .dashboard-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<script>
/* ============================================================
   GITHUB DB — replaces localStorage with GitHub REST API
   All JSON files live in the root of the configured repo.
   Session/credentials are still kept in localStorage (client-only).
   ============================================================ */
const DB = {
  /* ---- Session (stays in localStorage — never goes to GitHub) ---- */
  SESSION: 'mycms_session',
  GH_CONFIG: 'mycms_gh_config',

  getSession()  { try { return JSON.parse(localStorage.getItem(this.SESSION) || 'null') } catch { return null } },
  setSession(s) { localStorage.setItem(this.SESSION, JSON.stringify(s)) },
  clearSession(){ localStorage.removeItem(this.SESSION) },

  /* ---- GitHub configuration ---- */
  getConfig() {
    try { return JSON.parse(localStorage.getItem(this.GH_CONFIG) || 'null') } catch { return null }
  },
  saveConfig(c) { localStorage.setItem(this.GH_CONFIG, JSON.stringify(c)) },
  isConfigured() { const c = this.getConfig(); return !!(c && c.token && c.owner && c.repo) },

  /* ---- Low-level GitHub Contents API helpers ---- */
  _headers() {
    const c = this.getConfig();
    return {
      'Authorization': `token ${c.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    };
  },
  _apiUrl(file) {
    const c = this.getConfig();
    return `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${file}`;
  },

  /* Fetch a JSON file from the repo. Returns { data, sha } or { data: default, sha: null } */
  async _getFile(file, defaultVal = null) {
    const resp = await fetch(this._apiUrl(file), { headers: this._headers() });
    if (resp.status === 404) return { data: defaultVal, sha: null };
    if (!resp.ok) throw new Error(`GitHub API error ${resp.status}: ${resp.statusText}`);
    const meta = await resp.json();
    const content = atob(meta.content.replace(/\n/g, ''));
    return { data: JSON.parse(content), sha: meta.sha };
  },

  /* Write a JSON file to the repo. sha is required for updates, null for creates. */
  async _putFile(file, data, sha, message) {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const body = { message: message || `Update ${file} via MyCMS`, content };
    if (sha) body.sha = sha;
    const resp = await fetch(this._apiUrl(file), {
      method: 'PUT',
      headers: this._headers(),
      body: JSON.stringify(body)
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.message || `GitHub write error ${resp.status}`);
    }
    const result = await resp.json();
    return result.content.sha; // new sha
  },

  /* ---- SHA cache to avoid double fetches on save ---- */
  _shas: {},
  async _cachedGet(file, defaultVal) {
    const { data, sha } = await this._getFile(file, defaultVal);
    this._shas[file] = sha;
    return data;
  },
  async _cachedPut(file, data, msg) {
    const sha = this._shas[file] || null;
    const newSha = await this._putFile(file, data, sha, msg);
    this._shas[file] = newSha;
  },

  /* ---- Public API methods (async) ---- */
  async getPosts()           { return this._cachedGet('posts.json', []) },
  async savePosts(posts)     { return this._cachedPut('posts.json', posts, 'Update posts.json via MyCMS') },

  async getSettings() {
    const defaults = { siteTitle:'MyCMS', tagline:'Just another MyCMS site', username:'admin', passwordHash: btoa('admin123') };
    const d = await this._cachedGet('settings.json', null);
    return d || defaults;
  },
  async saveSettings(s)      { return this._cachedPut('settings.json', s, 'Update settings.json via MyCMS') },

  async getAbout()           { return this._cachedGet('about.json', { content: '<p>About this site.</p>' }) },
  async saveAbout(a)         { return this._cachedPut('about.json', a, 'Update about.json via MyCMS') },

  async getGallery()         { return this._cachedGet('gallery.json', []) },
  async saveGallery(g)       { return this._cachedPut('gallery.json', g, 'Update gallery.json via MyCMS') },

  async getDownloads()       { return this._cachedGet('downloads.json', []) },
  async saveDownloads(d)     { return this._cachedPut('downloads.json', d, 'Update downloads.json via MyCMS') },

  /* ---- Verify connection ---- */
  async testConnection() {
    const c = this.getConfig();
    const resp = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}`, { headers: this._headers() });
    if (!resp.ok) throw new Error(`Cannot reach repo: ${resp.status}`);
    return await resp.json();
  }
};

/* ============================================================
   UTILITY FUNCTIONS
   ============================================================ */
function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) }
function slugify(s)    { return String(s||'').toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-') }
function formatDate(iso){ try { return new Date(iso).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) } catch { return '' } }
function isLoggedIn()   { const s = DB.getSession(); return s && s.loggedIn }
function parseHash()    { const hash = location.hash.slice(1)||'/'; const [pathPart,qs] = hash.split('?'); const parts = pathPart.split('/').filter(Boolean); return { path:pathPart, parts, query: new URLSearchParams(qs||'') } }
function uid()          { return Date.now().toString(36) + Math.random().toString(36).slice(2,7) }

/* Show a brief toast notification */
function toast(msg, type='success') {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:24px;right:24px;z-index:99999;padding:12px 20px;border-radius:6px;font-size:14px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:opacity .3s;max-width:360px;`;
  t.style.background = type==='error'?'#d63638':type==='warning'?'#dba617':'#1f6b2c';
  t.style.color = '#fff';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(),350) }, 3200);
}

/* Detect YouTube/Dropbox/video URL and return embed HTML */
function buildMediaEmbed(url) {
  if (!url) return '';
  // YouTube
  const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (ytMatch) return `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen></iframe>`;
  // Dropbox video – convert ?dl=0 to raw=1
  if (url.includes('dropbox.com')) {
    const raw = url.replace('www.dropbox.com','dl.dropboxusercontent.com').replace(/[?&]dl=\d/,'').replace(/[?&]raw=\d/,'');
    return `<video src="${escapeHtml(raw)}" controls></video>`;
  }
  // Direct video file
  if (/\.(mp4|webm|ogg)(\?|$)/i.test(url)) return `<video src="${escapeHtml(url)}" controls></video>`;
  // Fallback: iframe
  return `<iframe src="${escapeHtml(url)}" allowfullscreen></iframe>`;
}

/* ============================================================
   ROUTER
   ============================================================ */
async function router() {
  const { parts } = parseHash();
  const hash = location.hash || '#/';
  if (hash.startsWith('#/login'))   { renderLogin(); return }
  if (hash.startsWith('#/admin'))   { if (!isLoggedIn()) { location.hash='#/login'; return } await renderAdmin(parts); return }
  await renderPublic(parts);
}

    <a href="#/" class="logo"><span class="logo-dot"></span>${escapeHtml(settings.siteTitle)}</a>
    <nav class="nav" id="mainNav">

      <a href="#/gallery" data-nav="gallery">Gallery</a>

  });

    document.getElementById('siteSearchForm').classList.toggle('open'));

function renderPostGrid(container, posts) {
  const grid = document.createElement('div'); grid.className='post-grid';
  if (!posts.length) { grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><h3>No posts yet</h3><p>Check back soon.</p></div>` }
  else posts.forEach(p => {
    const card = document.createElement('article'); card.className='post-card';
    card.onclick = () => location.hash = '#/post/' + p.slug;
    const bg = `linear-gradient(135deg,hsl(${[...p.title].reduce((a,c)=>a+c.charCodeAt(0),0)%360},70%,60%),hsl(${([...p.title].reduce((a,c)=>a+c.charCodeAt(0),0)+60)%360},70%,50%))`;
    card.innerHTML = `
      <div class="post-card-img-wrap">${p.featuredImage?`<img src="${escapeHtml(p.featuredImage)}" alt="" class="post-card-img" loading="lazy">`:`<div style="width:100%;height:100%;background:${bg}"></div>`}</div>
      <div class="post-card-body">
        <div class="post-card-cat" onclick="event.stopPropagation();location.hash='#/category/${encodeURIComponent((p.category||'Uncategorized').toLowerCase())}'">${escapeHtml(p.category||'Uncategorized')}</div>
        <h2 class="post-card-title">${escapeHtml(p.title)}</h2>
        <p class="post-card-excerpt">${escapeHtml(p.excerpt||'')}</p>
        <div class="post-card-meta"><span>${formatDate(p.date)}</span><span>•</span><span>${escapeHtml(p.author||'admin')}</span></div>
      </div>`;
    grid.appendChild(card);
  });
  container.appendChild(grid);
}

function renderSinglePost(container, post) {
  const bg = `linear-gradient(135deg,hsl(${[...post.title].reduce((a,c)=>a+c.charCodeAt(0),0)%360},70%,60%),hsl(${([...post.title].reduce((a,c)=>a+c.charCodeAt(0),0)+60)%360},70%,50%))`;
  const mediaHtml = post.mediaUrl ? `<div class="media-embed-wrap">${buildMediaEmbed(post.mediaUrl)}</div>` : '';
  const heroHtml  = post.featuredImage ? `<img src="${escapeHtml(post.featuredImage)}" alt="" class="article-hero">` : (!post.mediaUrl ? `<div class="article-hero" style="background:${bg}"></div>` : '');
  container.innerHTML = `
    <article class="article-wrap">
      ${heroHtml}${mediaHtml}
      <a href="#/category/${encodeURIComponent((post.category||'').toLowerCase())}" class="article-cat">${escapeHtml(post.category)}</a>
      <h1 class="article-title">${escapeHtml(post.title)}</h1>
      <div class="article-meta"><span>${formatDate(post.date)}</span><span>•</span><span>By ${escapeHtml(post.author||'admin')}</span></div>
      <div class="article-content">${post.content}</div>
      <div style="margin-top:48px;padding-top:24px;border-top:1px solid var(--wp-gray-10)"><a href="#/" class="btn btn-secondary">← Back to all posts</a></div>
    </article>`;
}

          <li><a href="#" id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</a></li>
        </ul>
      </aside>
      <div class="admin-main">
        <div class="admin-topbar">
          <button class="admin-burger" id="adminBurger">☰</button>
          <div class="admin-title" id="adminPageTitle">Dashboard</div>
          <span class="gh-status ${ghConfigured?'connected':'disconnected'}" id="ghStatusBadge">
            <span class="gh-dot"></span>${ghConfigured?'GitHub connected':'GitHub not configured'}
          </span>
          <div class="admin-user">
            <span>Howdy, ${escapeHtml(session.username)}</span>
            <div class="admin-avatar">${escapeHtml(session.username.charAt(0).toUpperCase())}</div>
          </div>
        </div>
        <div class="admin-content" id="adminContent"><div class="empty-state"><span class="spinner"></span></div></div>
      </div>
    </div>
    <div class="admin-overlay" id="adminOverlay"></div>`;

  document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); DB.clearSession(); location.hash='#/login' });
  const burger=document.getElementById('adminBurger'), sidebar=document.getElementById('adminSidebar'), overlay=document.getElementById('adminOverlay');
  burger.addEventListener('click', () => { sidebar.classList.toggle('open'); overlay.classList.toggle('open') });
  overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('open') });

  const page = parts[1] || 'dashboard';
  document.querySelectorAll('#adminMenu a').forEach(a => a.classList.remove('active'));
  const activeEl = document.querySelector(`#adminMenu a[data-page="${page}"]`) || document.querySelector('#adminMenu a[data-page="posts"]');
  if (parts[1]==='posts' && parts[2]==='new') document.querySelector('[data-page="new"]').classList.add('active');
  else if (activeEl) activeEl.classList.add('active');

  const content  = document.getElementById('adminContent');
  const titleEl  = document.getElementById('adminPageTitle');

  /* Guard: most pages need GitHub configured */
  const needsGH = ['posts','new','portfolio','gallery','downloads','about','settings','dashboard'];
  if (!ghConfigured && needsGH.includes(page)) {
    content.innerHTML = `<div class="wp-notice warning">⚠️ GitHub is not configured yet. <a href="#/admin/github">Go to GitHub Config</a> to connect your repository before managing content.</div>`;
    titleEl.textContent = page.charAt(0).toUpperCase()+page.slice(1);
    return;
  }

  if (!page || page==='dashboard') {
    titleEl.textContent = 'Dashboard';
    await renderDashboard(content);
  } else if (page==='posts') {
    if (parts[2]==='new')                { titleEl.textContent='Add New Post';  await renderPostEditor(content, null) }
    else if (parts[2]==='edit'&&parts[3]){ titleEl.textContent='Edit Post';     await renderPostEditor(content, parts[3]) }
    else                                  { titleEl.textContent='Posts';         await renderPostsList(content) }
  } else if (page==='portfolio') {
    titleEl.textContent='Portfolio'; await renderPortfolio(content);
  } else if (page==='gallery') {
    titleEl.textContent='Gallery'; await renderGalleryAdmin(content);
  } else if (page==='downloads') {
    titleEl.textContent='Freebies / Downloads'; await renderDownloadsAdmin(content);
  } else if (page==='about') {
    titleEl.textContent='About Page Editor'; await renderAboutAdmin(content);
  } else if (page==='settings') {
    titleEl.textContent='Settings'; await renderSettings(content);
  } else if (page==='github') {
    titleEl.textContent='GitHub Configuration'; renderGitHubConfig(content);
  }
}

/* ============================================================
   ADMIN: POSTS LIST
   ============================================================ */
async function renderPostsList(container) {
  container.innerHTML = `<div class="empty-state"><span class="spinner"></span></div>`;
  let posts;
  try { posts = await DB.getPosts() } catch(e) { container.innerHTML=`<div class="wp-notice error">${escapeHtml(e.message)}</div>`; return }

  let filter='all', search='';
  function draw() {
    let filtered = [...posts];
    if (filter!=='all') filtered = filtered.filter(p=>p.status===filter);
    if (search) filtered = filtered.filter(p=>p.title.toLowerCase().includes(search)||(p.excerpt||'').toLowerCase().includes(search));
    filtered.sort((a,b)=>new Date(b.date)-new Date(a.date));
    container.innerHTML = `
      <div class="wp-card">
        <div class="wp-card-header"><div class="toolbar" style="width:100%;margin:0">
          <div class="filter-tabs">
            <button data-f="all" class="${filter==='all'?'active':''}">All (${posts.length})</button>
            <button data-f="published" class="${filter==='published'?'active':''}">Published (${posts.filter(p=>p.status==='published').length})</button>
            <button data-f="draft" class="${filter==='draft'?'active':''}">Drafts (${posts.filter(p=>p.status==='draft').length})</button>
          </div>
          <div class="search-mini"><input type="search" placeholder="Search posts…" id="postSearch" value="${escapeHtml(search)}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </div>
          <a href="#/admin/posts/new" class="btn btn-primary" style="margin-left:auto">Add New</a>
        </div></div>
        <div class="wp-card-body" style="padding:0"><div class="table-wrap"><table class="wp-table">
          <thead><tr><th style="width:40%">Title</th><th>Category</th><th>Portfolio</th><th>Status</th><th>Date</th></tr></thead>
          <tbody>${filtered.map(p=>`
            <tr>
              <td><div class="row-title" onclick="location.hash='#/admin/posts/edit/${p.id}'">${escapeHtml(p.title)}</div>
              <div class="row-actions"><a href="#/admin/posts/edit/${p.id}">Edit</a>${p.status==='published'?`<a href="#/post/${p.slug}" target="_blank">View</a>`:''}<a href="#" class="delete" data-id="${p.id}">Trash</a></div></td>
              <td>${escapeHtml(p.category||'—')}</td>
              <td>${p.isPortfolio?'<span class="status-badge status-published">Yes</span>':'—'}</td>
              <td><span class="status-badge status-${p.status}">${p.status}</span></td>
              <td>${formatDate(p.date)}</td>
            </tr>`).join('')||`<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--wp-gray-50)">No posts found</td></tr>`}
          </tbody>
        </table></div></div>
      </div>`;
    container.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.f;draw()}));
    document.getElementById('postSearch').addEventListener('input',e=>{search=e.target.value.toLowerCase();draw()});
    container.querySelectorAll('.delete').forEach(a=>a.addEventListener('click',async e=>{
      e.preventDefault(); if(!confirm('Move this post to trash?')) return;
      const idx=posts.findIndex(p=>p.id===a.dataset.id); if(idx<0) return;
      posts.splice(idx,1);
      try { await DB.savePosts(posts); toast('Post deleted'); draw() } catch(err) { toast(err.message,'error') }
    }));
  }
  draw();
}

/* ============================================================
   ADMIN: POST EDITOR (Blog + Portfolio)
   ============================================================ */
async function renderPostEditor(container, id=null) {
  container.innerHTML = `<div class="empty-state"><span class="spinner"></span></div>`;
  let posts;
  try { posts = await DB.getPosts() } catch(e) { container.innerHTML=`<div class="wp-notice error">${escapeHtml(e.message)}</div>`; return }
  const isEdit = !!id; const post = isEdit ? posts.find(p=>p.id===id) : null;
  if (isEdit && !post) { container.innerHTML='<p>Post not found</p>'; return }
  const data = post || { id:uid(), title:'', slug:'', content:'', excerpt:'', featuredImage:'', mediaUrl:'', category:'Uncategorized', tags:[], status:'draft', isPortfolio:false, date:new Date().toISOString(), author:DB.getSession().username };

  container.innerHTML = `
    <form id="postForm"><div class="form-grid">
      <div class="form-main">
        <div class="wp-card"><div class="wp-card-body">
          <div class="form-row"><input type="text" class="form-input title-input" id="postTitle" placeholder="Add title" value="${escapeHtml(data.title)}" required></div>
          <div class="form-row" style="margin-top:12px"><div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--wp-gray-50)"><span>Permalink:</span><span style="color:var(--wp-blue)">#/post/</span><input type="text" id="postSlug" value="${escapeHtml(data.slug)}" style="border:none;border-bottom:1px dashed #ccc;padding:2px 4px;font-size:13px;width:200px;background:transparent"></div></div>
        </div></div>
        <div class="wp-card"><div class="wp-card-body" style="padding:0"><div class="editor-wrap">
          <div class="editor-toolbar">
            <button type="button" data-cmd="bold"><b>B</b></button>
            <button type="button" data-cmd="italic"><i>I</i></button>
            <button type="button" data-cmd="underline"><u>U</u></button><span class="sep"></span>
            <button type="button" data-cmd="formatBlock" data-val="h2">H2</button>
            <button type="button" data-cmd="formatBlock" data-val="h3">H3</button>
            <button type="button" data-cmd="formatBlock" data-val="p">P</button><span class="sep"></span>
            <button type="button" data-cmd="insertUnorderedList">• List</button>
            <button type="button" data-cmd="insertOrderedList">1.</button><span class="sep"></span>
            <button type="button" data-cmd="createLink">🔗</button>
            <button type="button" data-cmd="insertImage">🖼️</button>
            <button type="button" data-cmd="formatBlock" data-val="blockquote">❝</button>
          </div>
          <div class="editor-content" id="postContent" contenteditable="true" data-placeholder="Start writing…">${data.content}</div>
        </div></div></div>
        <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Excerpt</h2></div><div class="wp-card-body"><textarea class="form-textarea" id="postExcerpt" placeholder="Write a short summary…">${escapeHtml(data.excerpt)}</textarea><div class="form-hint">Appears on homepage and search results.</div></div></div>
      </div>
      <div class="form-side">
        <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Publish</h2></div><div class="wp-card-body">
          <div class="form-row"><label class="form-label">Status</label><select class="form-select" id="postStatus"><option value="draft" ${data.status==='draft'?'selected':''}>Draft</option><option value="published" ${data.status==='published'?'selected':''}>Published</option></select></div>
          <div class="form-row"><label class="form-label">Publish date</label><input type="datetime-local" class="form-input" id="postDate" value="${new Date(data.date).toISOString().slice(0,16)}"></div>
          <div class="form-row"><label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;cursor:pointer"><input type="checkbox" id="postPortfolio" ${data.isPortfolio?'checked':''}>Mark as Portfolio item</label></div>
          <div style="display:flex;gap:8px;margin-top:16px">
            <button type="submit" class="btn btn-primary" style="flex:1" id="savePostBtn">${isEdit?'Update':'Publish'}</button>
            <a href="#/admin/posts" class="btn btn-secondary">Cancel</a>
          </div>
          <div id="saveStatus" style="margin-top:10px;font-size:13px;display:none"></div>
        </div></div>
        <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Featured Image</h2></div><div class="wp-card-body">
          <input type="url" class="form-input" id="postImage" placeholder="https://…" value="${escapeHtml(data.featuredImage)}">
          <div id="imgPreview" style="margin-top:10px;${data.featuredImage?'':'display:none'}"><img src="${escapeHtml(data.featuredImage)}" alt="" style="width:100%;border-radius:4px;aspect-ratio:16/9;object-fit:cover"></div>
        </div></div>
        <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Media / Portfolio URL</h2></div><div class="wp-card-body">
          <input type="url" class="form-input" id="postMedia" placeholder="YouTube, Dropbox, .mp4 URL…" value="${escapeHtml(data.mediaUrl||'')}">
          <div class="form-hint">Supports YouTube links, Dropbox video links, or direct .mp4 URLs. Will render as an embedded player above the post content.</div>
          <div id="mediaPreview" style="margin-top:12px;${data.mediaUrl?'':'display:none'}">
            <div class="media-embed-wrap" style="border-radius:8px;overflow:hidden">${data.mediaUrl?buildMediaEmbed(data.mediaUrl):''}</div>
          </div>
        </div></div>
        <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Categories & Tags</h2></div><div class="wp-card-body">
          <div class="form-row"><label class="form-label">Category</label><input type="text" class="form-input" id="postCategory" value="${escapeHtml(data.category)}" list="cats"><datalist id="cats"><option>News</option><option>Tutorial</option><option>Opinion</option><option>Portfolio</option><option>Uncategorized</option></datalist></div>
          <div class="form-row"><label class="form-label">Tags (comma separated)</label><input type="text" class="form-input" id="postTags" value="${escapeHtml((data.tags||[]).join(', '))}" placeholder="web, design"></div>
        </div></div>
      </div>
    </div></form>`;

  const titleEl=document.getElementById('postTitle'), slugEl=document.getElementById('postSlug');
  const contentEl=document.getElementById('postContent'), imgEl=document.getElementById('postImage');
  const imgPrev=document.getElementById('imgPreview'), mediaEl=document.getElementById('postMedia');
  const mediaPrev=document.getElementById('mediaPreview');

  let slugEdited=!!data.slug;
  slugEl.addEventListener('input',()=>slugEdited=true);
  titleEl.addEventListener('input',()=>{if(!slugEdited)slugEl.value=slugify(titleEl.value)});
  imgEl.addEventListener('input',()=>{if(imgEl.value){imgPrev.style.display='block';imgPrev.querySelector('img').src=imgEl.value}else imgPrev.style.display='none'});
  mediaEl.addEventListener('input',()=>{if(mediaEl.value){mediaPrev.style.display='block';mediaPrev.querySelector('.media-embed-wrap').innerHTML=buildMediaEmbed(mediaEl.value)}else mediaPrev.style.display='none'});

  container.querySelectorAll('[data-cmd]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const cmd=btn.dataset.cmd,val=btn.dataset.val; contentEl.focus();
      if(cmd==='createLink'){const url=prompt('Enter URL:','https://');if(url)document.execCommand('createLink',false,url)}
      else if(cmd==='insertImage'){const url=prompt('Image URL:','https://');if(url)document.execCommand('insertImage',false,url)}
      else document.execCommand(cmd,false,val&&cmd==='formatBlock'?`<${val}>`:val);
    });
  });

  document.getElementById('postForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const btn=document.getElementById('savePostBtn'), status=document.getElementById('saveStatus');
    btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Saving…';
    status.style.display='block'; status.style.color='var(--wp-gray-50)'; status.textContent='Saving to GitHub…';
    const updated={...data,
      title:titleEl.value.trim(), slug:slugEl.value.trim()||slugify(titleEl.value),
      content:contentEl.innerHTML, excerpt:document.getElementById('postExcerpt').value.trim()||contentEl.innerText.substring(0,160),
      featuredImage:imgEl.value.trim(), mediaUrl:mediaEl.value.trim(),
      category:document.getElementById('postCategory').value.trim()||'Uncategorized',
      tags:document.getElementById('postTags').value.split(',').map(t=>t.trim()).filter(Boolean),
      status:document.getElementById('postStatus').value,
      isPortfolio:document.getElementById('postPortfolio').checked,
      date:new Date(document.getElementById('postDate').value).toISOString()
    };
    if(isEdit){const idx=posts.findIndex(p=>p.id===id);posts[idx]=updated}else posts.unshift(updated);
    try {
      await DB.savePosts(posts);
      toast('Saved to GitHub ✓');
      location.hash='#/admin/posts';
    } catch(err) {
      status.style.color='#d63638'; status.textContent='Error: '+err.message;
      btn.disabled=false; btn.textContent=isEdit?'Update':'Publish';
    }
  });
}

/* ============================================================
   ADMIN: GALLERY
   ============================================================ */
async function renderGalleryAdmin(container) {
  container.innerHTML = `<div class="empty-state"><span class="spinner"></span></div>`;
  let images;
  try { images = await DB.getGallery() } catch(e) { container.innerHTML=`<div class="wp-notice error">${escapeHtml(e.message)}</div>`; return }

  function draw() {
    container.innerHTML = `
      <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Gallery Images (${images.length})</h2></div>
      <div class="wp-card-body">
        ${images.length ? `<div class="gallery-admin-grid">${images.map((img,i)=>`
          <div class="gallery-admin-item">
            <img src="${escapeHtml(img.url)}" alt="${escapeHtml(img.caption||'')}" loading="lazy">
            <button class="item-del" data-i="${i}" title="Remove">×</button>
          </div>`).join('')}</div>` : `<div class="empty-state" style="padding:40px 0"><h3>No images yet</h3><p>Add image URLs below.</p></div>`}
      </div></div>
      <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Add Images</h2></div>
      <div class="wp-card-body">
        <div id="addGalleryRows"></div>
        <button class="btn btn-secondary" id="addMoreRow" style="margin-top:8px">+ Add another row</button>
        <div style="display:flex;gap:10px;margin-top:16px">
          <button class="btn btn-primary" id="saveGalleryBtn">Save to GitHub</button>
          <span id="gallerySaveStatus" style="font-size:13px;line-height:36px;color:var(--wp-gray-50)"></span>
        </div>
      </div></div>`;

    container.querySelectorAll('.item-del').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Remove this image?')) return;
        images.splice(parseInt(btn.dataset.i), 1);
        try { await DB.saveGallery(images); toast('Gallery saved'); draw() } catch(e) { toast(e.message,'error') }
      });
    });

    const rowsWrap = document.getElementById('addGalleryRows');
    function addRow() {
      const row = document.createElement('div'); row.style.cssText='display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px';
      row.innerHTML = `<input type="url" class="form-input gal-url" placeholder="Image URL (https://…)"><input type="text" class="form-input gal-cap" placeholder="Caption (optional)"><button type="button" class="btn btn-secondary" style="padding:8px 10px" title="Remove row">✕</button>`;
      row.querySelector('button').addEventListener('click', () => row.remove());
      rowsWrap.appendChild(row);
    }
    addRow();
    document.getElementById('addMoreRow').addEventListener('click', addRow);

    document.getElementById('saveGalleryBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveGalleryBtn');
      const status = document.getElementById('gallerySaveStatus');
      const newItems = [...rowsWrap.querySelectorAll(':scope > div')].map(row => ({
        url: row.querySelector('.gal-url').value.trim(),
        caption: row.querySelector('.gal-cap').value.trim()
      })).filter(img => img.url);
      if (!newItems.length) { status.textContent='No new URLs entered.'; return }
      btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Saving…'; status.textContent='';
      images = [...images, ...newItems];
      try { await DB.saveGallery(images); toast('Gallery saved to GitHub ✓'); draw() } catch(e) { toast(e.message,'error'); btn.disabled=false; btn.textContent='Save to GitHub' }
    });
  }
  draw();
}

/* ============================================================
   ADMIN: DOWNLOADS / FREEBIES
   ============================================================ */
async function renderDownloadsAdmin(container) {
  container.innerHTML = `<div class="empty-state"><span class="spinner"></span></div>`;
  let items;
  try { items = await DB.getDownloads() } catch(e) { container.innerHTML=`<div class="wp-notice error">${escapeHtml(e.message)}</div>`; return }

  let editId = null;

  function draw() {
    container.innerHTML = `
      <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Freebies (${items.length})</h2></div>
      <div class="wp-card-body" style="padding:0"><div class="table-wrap"><table class="wp-table">
        <thead><tr><th>Title</th><th>Description</th><th>File URL</th><th></th></tr></thead>
        <tbody>
          ${items.length===0 ? `<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--wp-gray-50)">No freebies yet. Add one below.</td></tr>` :
            items.map((d,i)=>`
            <tr>
              <td><strong>${escapeHtml(d.title)}</strong></td>
              <td style="font-size:13px;color:#50575e">${escapeHtml(d.description||'')}</td>
              <td style="font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><a href="${escapeHtml(d.url)}" target="_blank" title="${escapeHtml(d.url)}">${escapeHtml(d.url)}</a></td>
              <td style="white-space:nowrap">
                <button class="btn btn-secondary dl-edit" data-i="${i}" style="margin-right:6px">Edit</button>
                <button class="btn btn-danger dl-del" data-i="${i}">Delete</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table></div></div></div>

      <div class="wp-card" id="dlFormCard">
        <div class="wp-card-header"><h2 class="wp-card-title" id="dlFormTitle">Add Freebie</h2></div>
        <div class="wp-card-body">
          <div class="form-row" style="margin-bottom:12px"><label class="form-label">Title *</label><input type="text" class="form-input" id="dlTitle" placeholder="e.g. Free Icon Pack"></div>
          <div class="form-row" style="margin-bottom:12px"><label class="form-label">Description</label><textarea class="form-textarea" id="dlDesc" placeholder="A short description of the freebie…" style="min-height:60px"></textarea></div>
          <div class="form-row" style="margin-bottom:16px"><label class="form-label">File / Download URL *</label><input type="url" class="form-input" id="dlUrl" placeholder="https://…"></div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary" id="dlSaveBtn">Save Freebie</button>
            <button class="btn btn-secondary" id="dlCancelBtn" style="display:none">Cancel</button>
            <span id="dlStatus" style="font-size:13px;line-height:36px;color:var(--wp-gray-50)"></span>
          </div>
        </div>
      </div>`;

    container.querySelectorAll('.dl-del').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this freebie?')) return;
        items.splice(parseInt(btn.dataset.i), 1);
        try { await DB.saveDownloads(items); toast('Deleted'); draw() } catch(e) { toast(e.message,'error') }
      });
    });

    container.querySelectorAll('.dl-edit').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = parseInt(btn.dataset.i); editId = i;
        const d = items[i];
        document.getElementById('dlFormTitle').textContent = 'Edit Freebie';
        document.getElementById('dlTitle').value = d.title;
        document.getElementById('dlDesc').value = d.description||'';
        document.getElementById('dlUrl').value = d.url;
        document.getElementById('dlCancelBtn').style.display='';
        document.getElementById('dlFormCard').scrollIntoView({behavior:'smooth'});
      });
    });

    document.getElementById('dlCancelBtn').addEventListener('click', () => {
      editId=null;
      document.getElementById('dlFormTitle').textContent='Add Freebie';
      document.getElementById('dlTitle').value=''; document.getElementById('dlDesc').value=''; document.getElementById('dlUrl').value='';
      document.getElementById('dlCancelBtn').style.display='none';
    });

    document.getElementById('dlSaveBtn').addEventListener('click', async () => {
      const title=document.getElementById('dlTitle').value.trim();
      const desc=document.getElementById('dlDesc').value.trim();
      const url=document.getElementById('dlUrl').value.trim();
      const btn=document.getElementById('dlSaveBtn'), status=document.getElementById('dlStatus');
      if (!title||!url) { status.style.color='#d63638'; status.textContent='Title and URL are required.'; return }
      btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Saving…'; status.textContent='';
      const entry={id:uid(),title,description:desc,url};
      if (editId!==null) { items[editId]=entry; editId=null } else items.push(entry);
      try { await DB.saveDownloads(items); toast('Saved to GitHub ✓'); draw() } catch(e) { toast(e.message,'error'); btn.disabled=false; btn.textContent='Save Freebie' }
    });
  }
  draw();
}

/* ============================================================
   ADMIN: ABOUT PAGE EDITOR
   ============================================================ */
async function renderAboutAdmin(container) {
  container.innerHTML = `<div class="empty-state"><span class="spinner"></span></div>`;
  let about;
  try { about = await DB.getAbout() } catch(e) { container.innerHTML=`<div class="wp-notice error">${escapeHtml(e.message)}</div>`; return }

  container.innerHTML = `
    <div class="wp-notice">This editor controls the public About page. Content is saved to <code>about.json</code> in your GitHub repository.</div>
    <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">About Page Content</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" id="saveAboutBtn">Save to GitHub</button>
        <span id="aboutStatus" style="font-size:13px;line-height:32px;color:var(--wp-gray-50)"></span>
      </div>
    </div>
    <div class="wp-card-body" style="padding:0"><div class="editor-wrap">
      <div class="editor-toolbar">
        <button type="button" data-cmd="bold"><b>B</b></button>
        <button type="button" data-cmd="italic"><i>I</i></button>
        <button type="button" data-cmd="underline"><u>U</u></button><span class="sep"></span>
        <button type="button" data-cmd="formatBlock" data-val="h2">H2</button>
        <button type="button" data-cmd="formatBlock" data-val="h3">H3</button>
        <button type="button" data-cmd="formatBlock" data-val="p">P</button><span class="sep"></span>
        <button type="button" data-cmd="insertUnorderedList">• List</button>
        <button type="button" data-cmd="insertOrderedList">1.</button><span class="sep"></span>
        <button type="button" data-cmd="createLink">🔗</button>
        <button type="button" data-cmd="insertImage">🖼️</button>
        <button type="button" data-cmd="formatBlock" data-val="blockquote">❝</button>
      </div>
      <div class="editor-content" id="aboutEditor" contenteditable="true" data-placeholder="Write your About page content…" style="min-height:400px">${about.content||''}</div>
    </div></div></div>`;

  container.querySelectorAll('[data-cmd]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const cmd=btn.dataset.cmd,val=btn.dataset.val; document.getElementById('aboutEditor').focus();
      if(cmd==='createLink'){const u=prompt('Enter URL:','https://');if(u)document.execCommand('createLink',false,u)}
      else if(cmd==='insertImage'){const u=prompt('Image URL:','https://');if(u)document.execCommand('insertImage',false,u)}
      else document.execCommand(cmd,false,val&&cmd==='formatBlock'?`<${val}>`:val);
    });
  });

  document.getElementById('saveAboutBtn').addEventListener('click', async () => {
    const btn=document.getElementById('saveAboutBtn'), status=document.getElementById('aboutStatus');
    btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Saving…'; status.textContent='';
    const content=document.getElementById('aboutEditor').innerHTML;
    try { await DB.saveAbout({content}); toast('About page saved to GitHub ✓'); status.style.color='#1f6b2c'; status.textContent='Saved!' } catch(e) { toast(e.message,'error'); status.style.color='#d63638'; status.textContent=e.message }
    btn.disabled=false; btn.textContent='Save to GitHub';
  });
}

/* ============================================================
   ADMIN: SETTINGS
   ============================================================ */
async function renderSettings(container) {
  container.innerHTML = `<div class="empty-state"><span class="spinner"></span></div>`;
  let s;
  try { s = await DB.getSettings() } catch(e) { container.innerHTML=`<div class="wp-notice error">${escapeHtml(e.message)}</div>`; return }

  container.innerHTML = `
    <div style="max-width:720px">
      <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">General Settings</h2></div><div class="wp-card-body">
        <div class="form-row"><label class="form-label">Site Title</label><input type="text" class="form-input" id="setTitle" value="${escapeHtml(s.siteTitle)}" required></div>
        <div class="form-row"><label class="form-label">Tagline</label><input type="text" class="form-input" id="setTagline" value="${escapeHtml(s.tagline)}"><div class="form-hint">In a few words, explain what this site is about.</div></div>
      </div></div>
      <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Admin Account</h2></div><div class="wp-card-body">
        <div class="form-row"><label class="form-label">Username</label><input type="text" class="form-input" id="setUser" value="${escapeHtml(s.username)}" required></div>
        <div class="form-row"><label class="form-label">New Password</label><input type="password" class="form-input" id="setPass" placeholder="Leave blank to keep current"><div class="form-hint">Stored as base64 in settings.json on GitHub.</div></div>
      </div></div>
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn btn-primary" id="saveSettBtn">Save Settings</button>
        <span id="settStatus" style="font-size:13px;color:var(--wp-gray-50)"></span>
      </div>
    </div>`;

  document.getElementById('saveSettBtn').addEventListener('click', async () => {
    const btn=document.getElementById('saveSettBtn'), status=document.getElementById('settStatus');
    btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Saving…'; status.textContent='';
    const updated={...s, siteTitle:document.getElementById('setTitle').value.trim(), tagline:document.getElementById('setTagline').value.trim(), username:document.getElementById('setUser').value.trim()};
    const np=document.getElementById('setPass').value; if(np) updated.passwordHash=btoa(np);
    try {
      await DB.saveSettings(updated);
      const sess=DB.getSession(); if(sess){sess.username=updated.username;DB.setSession(sess)}
      toast('Settings saved to GitHub ✓'); status.style.color='#1f6b2c'; status.textContent='Saved!';
    } catch(e) { toast(e.message,'error'); status.style.color='#d63638'; status.textContent=e.message }
    btn.disabled=false; btn.textContent='Save Settings';
  });
}

/* ============================================================
   ADMIN: GITHUB CONFIG
   ============================================================ */
function renderGitHubConfig(container) {
  const cfg = DB.getConfig() || {};
  container.innerHTML = `
    <div style="max-width:680px">
      <div class="wp-notice">Your GitHub Personal Access Token is stored only in your browser's localStorage and is never sent anywhere except the GitHub API directly from your browser.</div>
      <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">GitHub Repository</h2></div>
      <div class="wp-card-body">
        <div class="gh-config-grid">
          <div class="form-row gh-token-row">
            <label class="form-label">Personal Access Token (classic) *</label>
            <div class="token-input-wrap">
              <input type="password" class="form-input" id="ghToken" value="${escapeHtml(cfg.token||'')}" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
              <button class="token-toggle" id="tokenToggle" type="button">Show</button>
            </div>
            <div class="form-hint">Needs <strong>repo</strong> scope. <a href="https://github.com/settings/tokens/new?scopes=repo&description=MyCMS" target="_blank" rel="noopener">Generate one on GitHub →</a></div>
          </div>
          <div class="form-row">
            <label class="form-label">GitHub Username / Org *</label>
            <input type="text" class="form-input" id="ghOwner" value="${escapeHtml(cfg.owner||'')}" placeholder="your-username">
          </div>
          <div class="form-row">
            <label class="form-label">Repository Name *</label>
            <input type="text" class="form-input" id="ghRepo" value="${escapeHtml(cfg.repo||'')}" placeholder="my-cms-repo">
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
          <button class="btn btn-success" id="testGhBtn">Test Connection</button>
          <button class="btn btn-primary" id="saveGhBtn">Save Configuration</button>
          <span id="ghTestStatus" style="font-size:13px;line-height:36px"></span>
        </div>
      </div></div>

      <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Setup Guide</h2></div>
      <div class="wp-card-body" style="font-size:14px;line-height:1.8">
        <ol style="padding-left:20px;margin:0">
          <li>Create a <strong>public or private GitHub repository</strong> for your CMS content.</li>
          <li>Generate a <a href="https://github.com/settings/tokens/new?scopes=repo&description=MyCMS" target="_blank">Personal Access Token</a> with <code>repo</code> scope.</li>
          <li>Enter your token, username, and repo name above and click <strong>Save Configuration</strong>.</li>
          <li>Click <strong>Test Connection</strong> to verify everything works.</li>
          <li>MyCMS will automatically create <code>posts.json</code>, <code>settings.json</code>, <code>about.json</code>, <code>gallery.json</code>, and <code>downloads.json</code> in your repo when you first save content.</li>
        </ol>
        <div style="margin-top:16px;padding:12px;background:var(--wp-gray-5);border-radius:4px;font-size:13px">
          <strong>Tip for GitHub Pages:</strong> Host this <code>cms.html</code> file in the same repo and it becomes your full website — content and CMS in one place. Set GitHub Pages source to your <code>main</code> branch.
        </div>
      </div></div>
    </div>`;

  document.getElementById('tokenToggle').addEventListener('click', () => {
    const inp=document.getElementById('ghToken'), btn=document.getElementById('tokenToggle');
    if(inp.type==='password'){inp.type='text';btn.textContent='Hide'}else{inp.type='password';btn.textContent='Show'}
  });

  document.getElementById('saveGhBtn').addEventListener('click', () => {
    const token=document.getElementById('ghToken').value.trim();
    const owner=document.getElementById('ghOwner').value.trim();
    const repo=document.getElementById('ghRepo').value.trim();
    if(!token||!owner||!repo){toast('All three fields are required.','error');return}
    DB.saveConfig({token,owner,repo});
    DB._shas={};
    toast('GitHub configuration saved!');
    document.getElementById('ghTestStatus').style.color='#1f6b2c';
    document.getElementById('ghTestStatus').textContent='Config saved — click Test Connection to verify.';
    // Update topbar badge
    const badge=document.getElementById('ghStatusBadge');
    if(badge){badge.className='gh-status connected';badge.innerHTML='<span class="gh-dot"></span>GitHub connected'}
  });

// Test connection button click handler
  document.getElementById('testGhBtn').addEventListener('click', async () => {
    const btn=document.getElementById('testGhBtn'), status=document.getElementById('ghTestStatus');
    // Save credentials first
    const token=document.getElementById('ghToken').value.trim();
    const owner=document.getElementById('ghOwner').value.trim();
    const repo=document.getElementById('ghRepo').value.trim();
    
    if(!token||!owner||!repo){
      toast('Fill in all fields first.','error');
      return;
    }
    
    DB.saveConfig({token,owner,repo}); 
    DB._shas={};
    btn.disabled=true; 
    btn.innerHTML='<span class="spinner"></span> Testing…'; 
    status.textContent='';
    
    try {
      const repoData=await DB.testConnection();
      status.style.color='#1f6b2c';
      status.textContent=`✓ Connected to ${repoData.full_name} (${repoData.private?'private':'public'})`;
      toast('GitHub connection successful!');
      
      const badge=document.getElementById('ghStatusBadge');
      if(badge){
        badge.className='gh-status connected';
        badge.innerHTML='<span class="gh-dot"></span>GitHub connected';
      }

      // --- AUTOMATIC REDIRECT ---
      // Delays for 1.5 seconds so the user can read the success message, then routes to cms.html
      setTimeout(() => {
        window.location.href = 'cms.html';
      }, 1500);
      // --------------------------

    } catch(e) {
      status.style.color='#d63638';
      status.textContent='✗ ' + e.message;
      toast('Connection failed: '+e.message,'error');
    }
    
    btn.disabled=false; 
    btn.textContent='Test Connection';
  });
}
